<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Iberia Panel</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="login"><form class="card" id="f" autocomplete="on">
<h2 style="margin:0 0 4px">Iberia Panel</h2><div class="muted" style="margin-bottom:14px">Sign in to continue</div>
<label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<div class="err" id="e"></div><button class="pri" style="width:100%" id="b">Sign in</button></form></div>
<script src="/js/common.js"></script>
<script>
if (IB.token() && IB.user()) fetch('/api/me', { headers: { authorization: 'Bearer ' + IB.token() } }).then(r => { if (r.ok) location.replace('/menu.html'); });
$('f').addEventListener('submit', async ev => {
  ev.preventDefault(); $('e').textContent = ''; $('b').disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('u').value, password: $('p').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Could not sign in.');
    localStorage.setItem('ib_token', j.token); localStorage.setItem('ib_user', JSON.stringify(j.user)); location.href = '/menu.html';
  } catch (e) { $('e').textContent = e.message; $('b').disabled = false; }
});
</script></body></html>
